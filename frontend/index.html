<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能爬虫系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>智能爬虫系统</h1>

        <!-- 选项部分 -->
        <div class="section">
            <div class="section-title">选择爬取任务</div>
            <div class="form-group">
                <label for="task-type">任务类型:</label>
                <select id="task-type">
                    <option value="">请选择任务类型</option>
                    <option value="zhihu-question">爬取知乎单个问题</option>
                    <option value="bili-video">爬取B站单个视频</option>
                    <option value="xhs-detail">爬取小红书单个帖子下方评论</option>
                </select>
            </div>

            <!-- 动态参数输入区域 -->
            <div id="config-section" class="hidden">
                <div class="section-title">配置参数</div>
                <div id="dynamic-config"></div>
            </div>
        </div>

        <!-- 运行控制部分 -->
        <div class="section">
            <button id="run-btn" class="btn-run" disabled>运行爬虫和生成模型</button>
            <div id="run-status" class="status status-info hidden"></div>

            <!-- 二维码显示区域 -->
            <div id="qrcode-section" class="section hidden">
                <div class="section-title">扫码登录</div>
                <p>请使用手机扫描下方二维码进行登录：</p>
                <div id="qrcode-container">
                    <img id="qrcode-image" src="" alt="二维码登录" style="display: none;">
                </div>
                <p id="qrcode-message"></p>
            </div>

            <!-- 文件下载按钮 -->
            <div id="download-section" class="section hidden">
                <div class="section-title">下载结果</div>
                <button id="download-btn" class="btn-download">下载爬取结果</button>
            </div>

            <!-- 生成模型按钮 -->
            <div id="build-model-section" class="section hidden">
                <div class="section-title">模型构建</div>
                <button id="build-model-btn" class="btn-build-model">生成模型</button>
                <div id="build-model-status" class="status status-info hidden"></div>
            </div>
        </div>

        <!-- 文件上传部分 -->
        <div class="section">
            <div class="section-title">直接上传JSON构建模型</div>
            <div class="form-group">
                <label for="platform-type">平台类型:</label>
                <select id="platform-type">
                    <option value="zhihu">知乎</option>
                    <option value="bili">B站</option>
                    <option value="xhs">小红书</option>
                    <option value="default">默认</option>
                </select>
            </div>
            <div class="form-group">
                <input type="file" id="model-file" accept=".json">
                <button id="upload-model-btn" class="btn-run">上传并构建模型</button>
            </div>
            <div id="upload-model-status" class="status status-info hidden"></div>
        </div>

<!-- 结果展示部分 -->
<div id="result-section" class="section hidden">
    <div class="section-title">处理结果</div>

    <!-- 总结内容区域 -->
    <button id="summarize-btn" class="btn-summarize">总结内容</button>
    <div id="summary-result" class="result-section"></div>

    <!-- 问答区域 -->
    <button id="qa-btn" class="btn-qa">模型问答</button>
    <div id="qa-section" class="qa-section hidden">
        <div class="qa-input">
            <input type="text" id="qa-input" placeholder="请输入您的问题...">
            <button id="qa-submit">提问</button>
        </div>
        <div id="qa-history" class="qa-history"></div>
    </div>
</div>

    <script src="js/main.js" type="module"></script>
</body>
</html>
