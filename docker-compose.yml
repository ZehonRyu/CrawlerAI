version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  crawler_app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=False
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/app/data
      - BROWSER_DATA_DIR=/app/browser_data
    volumes:
      - ./data:/app/data
      - ./browser_data:/app/browser_data
      - ./sessions:/app/sessions
    restart: unless-stopped
    depends_on:
      - redis

  crawler-worker:
    build: .
    command: celery -A crawler_celery worker --loglevel=info --pool=solo --without-gossip --without-mingle
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./browser_data:/app/browser_data
      - ./sessions:/app/sessions
    restart: unless-stopped
    depends_on:
      - redis

  ai-worker:
    build: .
    command: celery -A ai_celery worker --loglevel=info --pool=solo --without-gossip --without-mingle
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./browser_data:/app/browser_data
      - ./sessions:/app/sessions
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  redis_data:
